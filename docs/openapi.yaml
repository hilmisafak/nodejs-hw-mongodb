openapi: 3.1.0
info:
  version: 1.0.0
  title: İletişim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    Node.js kursu için hazırlanan kişi yönetimi (Contacts) API dokümantasyonu.
tags:
  - name: Contacts
    description: Kişi işlemleri
servers:
  - url: http://localhost:3000
    description: Yerel Geliştirme Sunucusu
  - url: https://nodejs-hw-mongodb-xdc9.onrender.com
    description: Canlı sunucu
paths:
  /contacts:
    get:
      $ref: "../swagger/paths/contacts/get.yaml"
    post:
      $ref: "../swagger/paths/contacts/post.yaml"
  /contacts/{contactId}:
    get:
      $ref: "../swagger/paths/contacts/{id}/get.yaml"
    patch:
      $ref: "../swagger/paths/contacts/{id}/patch.yaml"
    delete:
      $ref: "../swagger/paths/contacts/{id}/delete.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
